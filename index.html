<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Private Office · Your setup</title>
<style>
:root{--navy:#0f2338;--gold:#a8834a;--paper:#faf8f4;--card:#fff;--ink:#1c2733;--mute:#6b7683;--line:#e4ddd0;--soft:#f3eee4;--ok:#2e6b4f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:0 20px 120px}
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:22px 0 14px;border-bottom:1px solid var(--line)}
.brand{font-size:12px;letter-spacing:.34em;font-weight:600;color:var(--navy)}
.tag{font:italic 13px "Iowan Old Style",Georgia,serif;color:var(--gold)}
h1,h2{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;color:var(--navy);font-weight:600;margin:0}
h1{font-size:38px;line-height:1.1;margin-top:6px}
h2{font-size:26px}
.kicker{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:34px 0 0}
.meta{color:var(--mute);font-size:14px;margin:10px 0 0}
.lead{font-size:17px;margin:18px 0 0}
.box{background:var(--soft);border-left:3px solid var(--gold);padding:14px 16px;margin:22px 0 0;font-size:15px;border-radius:0 6px 6px 0}
.box b{color:var(--navy)}
.bar{height:3px;background:var(--line);margin-top:0;position:sticky;top:0;z-index:5}
.bar i{display:block;height:3px;background:var(--gold);width:0;transition:width .25s}
.step{display:none;padding-top:8px}
.step.on{display:block}
.sh{display:flex;align-items:center;gap:12px;margin:30px 0 4px}
.sh .l{flex:none;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;font:600 14px/30px "Iowan Old Style",Georgia,serif;text-align:center}
.count{color:var(--mute);font-size:13px;margin:0 0 6px 42px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 16px 14px;margin-top:14px}
.q.cond{border-left:3px solid var(--gold)}
.q .t{font-weight:600;color:var(--navy);margin:0}
.q .t small{font-weight:400;color:var(--mute);font-size:13px;margin-left:6px}
.q .h{color:var(--mute);font-size:14px;margin:3px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font:inherit;font-size:15px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;min-height:42px}
.chip:hover{border-color:var(--gold)}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input[type=text],textarea{font:inherit;width:100%;margin-top:12px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(250,248,244,.96);border-top:1px solid var(--line);padding:12px 20px}
.nav div{max-width:680px;margin:0 auto;display:flex;justify-content:space-between;gap:10px}
.btn{font:inherit;font-weight:600;padding:12px 22px;border-radius:8px;border:1px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer;min-height:46px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.ghost{background:transparent;color:var(--navy);border-color:var(--line)}
.btn.gold{background:var(--gold);border-color:var(--gold)}
.btn[hidden]{display:none}
.sum{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:14px;overflow:hidden}
.sum h3{display:flex;justify-content:space-between;align-items:center;margin:0;padding:10px 16px;background:var(--soft);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--navy)}
.sum h3 button{font:inherit;font-size:13px;letter-spacing:0;text-transform:none;background:none;border:0;color:var(--gold);cursor:pointer;text-decoration:underline;padding:4px}
.sum dl{margin:0;padding:6px 16px 12px}
.sum dt{color:var(--mute);font-size:13px;margin-top:8px}
.sum dd{margin:0;white-space:pre-wrap}
.sum dd.e{color:#b9b2a5}
.send{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.send .btn{width:100%}
.done{color:var(--ok);font-size:14px;margin-top:10px;min-height:20px}
.foot{color:var(--mute);font-size:13px;margin-top:26px}
.admin label{display:block;font-weight:600;color:var(--navy);margin-top:16px}
.admin output{display:block;word-break:break-all;background:var(--soft);padding:12px;border-radius:8px;margin-top:14px;font-size:14px}
.ponly{display:none}
@media (max-width:480px){h1{font-size:31px}.send{grid-template-columns:1fr}}
@media print{
 @page{size:A4;margin:16mm 15mm}
 body{background:#fff;font-size:11.5px}
 .wrap{max-width:none;padding:0}
 .nav,.bar,#review,.count,#start{display:none!important}
 .step{display:block!important;padding:0}
 .q{display:block!important;break-inside:avoid;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:7px 0 8px;margin:0}
 .q.cond{border-left:0;padding-left:14px}
 h1{font-size:27px}.kicker{margin-top:16px}.lead{font-size:12.5px;margin-top:8px}.box{margin-top:10px;padding:8px 12px;font-size:11.5px}
 .sh{margin:13px 0 0;break-after:avoid}.sh .l{width:20px;height:20px;line-height:20px;font-size:11px}h2{font-size:16px}
 .chips{gap:4px 14px;margin-top:4px}
 .chip{border:0;padding:0;min-height:0;font-size:11.5px;background:none!important;color:var(--ink)!important}
 .chip::before{content:"";display:inline-block;width:9px;height:9px;border:1px solid var(--ink);margin-right:5px;vertical-align:-1px}
 .chip[aria-pressed=true]::before{background:var(--navy)}
 input[type=text]{border:0;border-bottom:1px solid var(--mute);border-radius:0;padding:0;height:17px;margin-top:5px}
 textarea{min-height:30px;height:30px;border:0;border-bottom:1px solid var(--mute);border-radius:0;margin-top:5px;padding:0}
 .q .h{font-size:10.5px;margin-top:1px}
 .ponly{display:block}
}
</style>
</head>
<body>
<div class="bar"><i id="prog"></i></div>
<div class="wrap">
<div class="mast"><span class="brand">PRIVATE OFFICE</span><span class="tag">Making AI personal</span></div>
<main id="app"></main>
</div>
<div class="nav" id="nav" hidden><div>
<button class="btn ghost" id="back" type="button">Back</button>
<button class="btn" id="next" type="button">Next</button>
</div></div>

<script>
"use strict";
/* ---------- The questions. Edit here; everything else follows. ---------- */
var has=function(a,id,v){var x=a[id];return Array.isArray(x)?x.some(function(o){return o.indexOf(v)===0}):x===v};
var SECTIONS=[
{title:"Devices",qs:[
 {id:"phone",t:"Your phone",type:"multi",opts:["iPhone","Android","More than one phone"]},
 {id:"android",t:"Which Android?",h:"Brand is enough: Samsung, Pixel, Xiaomi.",type:"text",when:function(a){return has(a,"phone","Android")}},
 {id:"computers",t:"Computers you use today",type:"multi",opts:["Mac","Windows","iPad or tablet","None, I work from the phone"]},
 {id:"where",t:"Where does your working day happen?",h:"This decides what we open to the phone and what stays on the machine only.",type:"single",opts:["Almost all on the phone","Mostly phone","Half and half","Mostly computer"]}
]},
{title:"Email and calendar",qs:[
 {id:"email",t:"Email",type:"multi",opts:["Gmail / Google Workspace","Outlook / Microsoft 365","iCloud"],other:"Other provider"},
 {id:"mailboxes",t:"How many mailboxes?",type:"single",opts:["One","Two or three","More"]},
 {id:"calendar",t:"Calendar",type:"multi",opts:["Google","Outlook","Apple","Paper, or none"]}
]},
{title:"Messages and calls",qs:[
 {id:"channels",t:"Where do you talk business?",type:"multi",opts:["WhatsApp","WhatsApp Business","Phone calls","Telegram","Signal","Zoom / Teams / Meet","Instagram / Facebook","SMS / iMessage"]},
 {id:"wabackup",t:"Is your WhatsApp backed up?",h:"The backup is how years of chats come in on Day 1.",type:"single",opts:["Yes, to iCloud","Yes, to Google","No","Not sure"],when:function(a){return has(a,"channels","WhatsApp")}},
 {id:"callrec",t:"Do you record your calls today?",type:"single",opts:["Yes","No, but I would like to","No, and I prefer not to"],when:function(a){return has(a,"channels","Phone calls")}},
 {id:"languages",t:"Which languages are the calls, messages and documents in?",type:"multi",opts:["English","Hebrew","Dutch","French","German","Spanish"],other:"Other languages"}
]},
{title:"Documents and software",qs:[
 {id:"docs",t:"Where are the documents?",type:"multi",opts:["Folders on the computer","Google Drive","iCloud","Dropbox","OneDrive","Only in email or WhatsApp","Paper"]},
 {id:"software",t:"Which programs run the business?",h:"Accounting, invoicing, banking, anything specific to your field. Names are enough.",type:"long"},
 {id:"ai",t:"AI you already use",type:"multi",opts:["ChatGPT","Claude","Gemini","Copilot","None"]},
 {id:"history",t:"How far back should the system go?",type:"single",opts:["Everything I have","The last five years","The last two years","Let's decide together"]}
]},
{title:"Security",qs:[
 {id:"sectoday",t:"What do you already use?",type:"multi",opts:["Password manager","Two-step login on email","VPN","Backup","None of these"]},
 {id:"people",t:"Who besides you should be able to use the system?",type:"multi",opts:["Nobody","An assistant","A business partner","Family","An accountant or advisor"],other:"Names or roles. Also: anyone who has access to your email or phone today"},
 {id:"never",t:"What must never enter the system?",h:"People, chats, folders or subjects. “Nothing” is also an answer.",type:"long"},
 {id:"private",t:"Do you want a private model on the machine?",h:"A model that runs only on your machine, for questions and material that should never go to an online service. It decides how strong a machine we order.",type:"single",opts:["Yes","Not needed","Tell me more first"]},
 {id:"worry",t:"What worries you most about having everything in one place?",type:"long",optional:true}
]},
{title:"The visit",qs:[
 {id:"place",t:"Where will the machine sit?",h:"Country, city, and whether it is your home or your office.",type:"text"},
 {id:"wired",t:"Is there wired internet at that spot?",type:"single",opts:["Yes","No","Not sure"]},
 {id:"dates",t:"Which dates work for two to three days with us?",type:"long"},
 {id:"else",t:"Anything else we should know?",type:"long",optional:true}
]}
];
/* ------------------------------------------------------------------------ */

var P=new URLSearchParams(location.hash.slice(1));
var clean=function(s,n){return (s||"").replace(/[\u0000-\u001f<>]/g,"").trim().slice(0,n)};
var CLIENT=clean(P.get("c"),60), WITH=clean(P.get("w"),60);
var WA=(P.get("wa")||"").replace(/\D/g,"").slice(0,15);
var MAIL=clean(P.get("m"),80); if(!/^[^\s@,;?&]+@[^\s@,;?&]+\.[^\s@,;?&]+$/.test(MAIL)) MAIL="";
var KEY="po-setup:"+(CLIENT||"guest");
var A={}; try{A=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){A={}}
var save=function(){try{localStorage.setItem(KEY,JSON.stringify(A))}catch(e){}};
var app=document.getElementById("app"), cur=-1, steps=[];
var el=function(tag,cls,txt){var n=document.createElement(tag);if(cls)n.className=cls;if(txt!=null)n.textContent=txt;return n};

if(P.has("admin")) admin(); else build();
window.addEventListener("hashchange",function(){location.reload()});

function build(){
 var w=el("section","step on");w.id="welcome";
 w.appendChild(el("p","kicker","Before we start"));
 w.appendChild(el("h1","","Your setup"));
 w.appendChild(el("p","meta",(CLIENT?"For "+CLIENT+(WITH?" and "+WITH:"")+"  ·  ":"")+"about 8 minutes  ·  mostly ticking boxes"));
 w.appendChild(el("p","lead","A few questions about what you use today, so the machine arrives ready for you. Your business itself comes later, once the base is built. Skip anything you are not sure about."));
 var b=el("div","box");b.appendChild(el("b","","Answers only. "));
 b.appendChild(document.createTextNode("Please do not write passwords or account numbers, and do not send documents or files. This page sends nothing by itself: your answers stay in this browser until you send them to us yourself, at the end."));
 w.appendChild(b);
 if(!CLIENT){var nq=qbox({id:"name",t:"Your name",type:"text"});w.appendChild(nq)}
 var s=el("button","btn gold","Start");s.id="start";s.type="button";s.style.marginTop="26px";s.onclick=function(){go(0)};
 if(Object.keys(A).length) s.textContent="Continue where you stopped";
 w.appendChild(s);app.appendChild(w);

 SECTIONS.forEach(function(sec,i){
  var st=el("section","step");
  var sh=el("div","sh");sh.appendChild(el("span","l",String(i+1)));sh.appendChild(el("h2","",sec.title));st.appendChild(sh);
  st.appendChild(el("p","count","Part "+(i+1)+" of "+SECTIONS.length));
  sec.qs.forEach(function(q){st.appendChild(qbox(q))});
  app.appendChild(st);steps.push(st);
 });
 var r=el("section","step");r.id="review";app.appendChild(r);steps.push(r);
 document.getElementById("back").onclick=function(){go(cur-1)};
 document.getElementById("next").onclick=function(){go(cur+1)};
 refresh();
}

function qbox(q){
 var box=el("div","q"+(q.when?" cond":""));box.dataset.q=q.id;
 var t=el("p","t",q.t);if(q.optional)t.appendChild(el("small","","optional"));box.appendChild(t);
 if(q.h)box.appendChild(el("p","h",q.h));
 if(q.type==="multi"||q.type==="single"){
  var c=el("div","chips");
  q.opts.forEach(function(o){
   var ch=el("button","chip",o);ch.type="button";
   var on=q.type==="multi"?(A[q.id]||[]).indexOf(o)>-1:A[q.id]===o;
   ch.setAttribute("aria-pressed",on?"true":"false");
   ch.onclick=function(){
    if(q.type==="single"){A[q.id]=A[q.id]===o?"":o;[].forEach.call(c.children,function(x){x.setAttribute("aria-pressed",x.textContent===A[q.id]?"true":"false")})}
    else{var arr=A[q.id]||[],k=arr.indexOf(o);if(k>-1)arr.splice(k,1);else arr.push(o);A[q.id]=arr;ch.setAttribute("aria-pressed",k>-1?"false":"true")}
    save();refresh();
   };
   c.appendChild(ch);
  });
  box.appendChild(c);
  if(q.other)box.appendChild(field(q.id+"_other","text",q.other));
 }else box.appendChild(field(q.id,q.type==="long"?"long":"text",""));
 return box;
}
function field(id,kind,ph){
 var f=kind==="long"?el("textarea"):el("input");if(kind!=="long")f.type="text";
 f.value=A[id]||"";f.placeholder=ph;f.setAttribute("aria-label",ph||id);f.maxLength=kind==="long"?1500:200;
 f.oninput=function(){A[id]=f.value;save()};return f;
}
function refresh(){
 SECTIONS.forEach(function(sec){sec.qs.forEach(function(q){
  if(!q.when)return;var n=app.querySelector('[data-q="'+q.id+'"]');if(n)n.style.display=q.when(A)?"":"none";
 })});
}
function go(i){
 if(i<0){cur=-1}else cur=Math.min(i,steps.length-1);
 document.getElementById("welcome").classList.toggle("on",cur<0);
 steps.forEach(function(s,k){s.classList.toggle("on",k===cur)});
 var last=cur===steps.length-1;
 document.getElementById("nav").hidden=cur<0;
 document.getElementById("next").hidden=last;
 document.getElementById("next").textContent=cur===steps.length-2?"Review":"Next";
 document.getElementById("prog").style.width=(cur<0?0:Math.round((cur+(last?1:0.5))/SECTIONS.length*100))+"%";
 if(last)review();
 window.scrollTo(0,0);
}
function val(q){
 var v=A[q.id],o=(A[q.id+"_other"]||"").trim(),out=Array.isArray(v)?v.join(", "):(v||"").trim();
 if(o)out=out?out+" ("+o+")":o;return out;
}
function shown(q){return !q.when||q.when(A)}
function who(){return CLIENT||(A.name||"").trim()}
function summary(){
 var d=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
 var L=["PRIVATE OFFICE · setup answers",(who()?who()+" · ":"")+d,""];
 SECTIONS.forEach(function(sec){
  L.push(sec.title.toUpperCase());
  sec.qs.forEach(function(q){if(shown(q)){var v=val(q);if(v||!q.optional)L.push(q.t+" "+(v||"—"))}});
  L.push("");
 });
 return L.join("\n").trim();
}
function review(){
 var r=document.getElementById("review");r.textContent="";
 var sh=el("div","sh");sh.appendChild(el("span","l","✓"));sh.appendChild(el("h2","","Check and send"));r.appendChild(sh);
 var open=0;
 SECTIONS.forEach(function(sec,i){
  var s=el("div","sum"),h=el("h3","",sec.title),e=el("button","","Edit");e.type="button";e.onclick=function(){go(i)};h.appendChild(e);s.appendChild(h);
  var dl=el("dl");
  sec.qs.forEach(function(q){if(!shown(q))return;var v=val(q);if(!v&&q.optional)return;if(!v)open++;
   dl.appendChild(el("dt","",q.t));dl.appendChild(el("dd",v?"":"e",v||"not answered"))});
  s.appendChild(dl);r.appendChild(s);
 });
 r.insertBefore(el("p","meta",open?open+" not answered. That is fine, we can close them on a call.":"Everything is answered."),r.children[1]);
 var b=el("div","box");b.appendChild(el("b","","Nothing has been sent yet. "));
 b.appendChild(document.createTextNode("Choose how to send your answers to us."));r.appendChild(b);
 var g=el("div","send"),txt=summary(),sub="Private Office setup answers"+(who()?" · "+who():"");
 var done=el("p","done");
 var link=function(label,href,cls){var a=el("a","btn"+(cls||""),label);a.href=href;a.target="_blank";a.rel="noopener noreferrer";g.appendChild(a)};
 link("Send by WhatsApp","https://wa.me/"+WA+"?text="+encodeURIComponent(txt)," gold");
 link("Send by email","mailto:"+MAIL+"?subject="+encodeURIComponent(sub)+"&body="+encodeURIComponent(txt));
 var c=el("button","btn ghost","Copy the answers");c.type="button";
 c.onclick=function(){var ok=function(){done.textContent="Copied. Paste it into a message to us."};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,fallback);else fallback();
  function fallback(){var t=el("textarea");t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(e){done.textContent="Could not copy. Please use WhatsApp or email."}t.remove()}};
 g.appendChild(c);
 var x=el("button","btn ghost","Clear my answers from this browser");x.type="button";
 x.onclick=function(){if(confirm("Remove your answers from this browser? Do this after you have sent them.")){try{localStorage.removeItem(KEY)}catch(e){}A={};location.reload()}};
 g.appendChild(x);r.appendChild(g);r.appendChild(done);
 r.appendChild(el("p","foot","Your answers are kept only in this browser, so you can stop and come back. Once you have sent them, you can clear them here."));
}

function admin(){
 document.title="Private Office · Link builder";
 var a=el("section","step on admin");
 a.appendChild(el("p","kicker","Internal"));a.appendChild(el("h1","","Client link"));
 a.appendChild(el("p","lead","Fill in the client, copy the link, send it. Everything after the # stays in the browser and is never sent to the web server."));
 var saved={};try{saved=JSON.parse(localStorage.getItem("po-admin")||"{}")||{}}catch(e){}
 var F={};[["c","Client name","Full name"],["w","Also for (optional)","An advisor or assistant"],["wa","Your WhatsApp number, with country code (optional)",""],["m","Your email for the answers (optional)",""]].forEach(function(r){
  var l=el("label","",r[1]),i=el("input");i.type="text";i.placeholder=r[2];if(r[0]==="wa"||r[0]==="m")i.value=saved[r[0]]||"";
  i.oninput=make;l.appendChild(i);a.appendChild(l);F[r[0]]=i});
 var out=el("output","","");a.appendChild(out);
 var cp=el("button","btn gold","Copy link");cp.type="button";cp.style.marginTop="14px";
 cp.onclick=function(){if(navigator.clipboard)navigator.clipboard.writeText(out.textContent).then(function(){cp.textContent="Copied"})};a.appendChild(cp);
 a.appendChild(el("p","foot","Without a WhatsApp number or email, the client's send buttons open WhatsApp or mail and the client picks you as the recipient."));
 app.appendChild(a);make();
 function make(){var q=new URLSearchParams();["c","w","wa","m"].forEach(function(k){var v=F[k].value.trim();if(k==="wa")v=v.replace(/\D/g,"");if(v)q.set(k,v)});
  try{localStorage.setItem("po-admin",JSON.stringify({wa:F.wa.value,m:F.m.value}))}catch(e){}
  cp.textContent="Copy link";out.textContent=location.href.split("#")[0]+(q.toString()?"#"+q.toString():"")}
}
</script>
</body>
</html>
